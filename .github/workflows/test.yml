name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs when a new commit lands on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          # Install a minimal subset — torch/whisper not needed for these checks.
          # Full requirements.txt installs ~10 minutes of ML deps.
          pip install -r requirements-ci.txt

      - name: Verify module imports (10 assertions)
        id: verify-imports
        run: |
          python scripts/verify_integration_imports.py

      - name: Run Sprint 1 unit tests (hard filter + JSON schema)
        id: sprint1
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tests/test_sprint1_autocut.py

      - name: Run Sprint 2 unit tests (verify pass + emotion lock)
        id: sprint2
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tests/test_sprint2_autocut.py

      - name: Run Sprint 3 unit tests (cache + cost + YouTube handler)
        id: sprint3
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tests/test_sprint3_autocut.py

      - name: Run Sprint 4 unit tests (review queue agent)
        id: sprint4
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tests/test_review_queue_agent.py

      - name: Summarize
        if: always()
        run: |
          echo "::group::Workflow summary"
          echo "Static checks: ${{ steps.verify-imports.outcome }}"
          echo "Sprint 1: ${{ steps.sprint1.outcome }}"
          echo "Sprint 2: ${{ steps.sprint2.outcome }}"
          echo "Sprint 3: ${{ steps.sprint3.outcome }}"
          echo "Sprint 4: ${{ steps.sprint4.outcome }}"
          echo "::endgroup::"