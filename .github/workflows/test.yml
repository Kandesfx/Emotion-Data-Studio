name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel in-progress runs when a new commit lands on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Static checks + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/emotion-data-studio/requirements-ci.txt

      - name: Install CI dependencies
        working-directory: tools/emotion-data-studio
        run: |
          python -m pip install --upgrade pip
          # Install a minimal subset — torch/whisper not needed for these checks.
          # Full requirements.txt installs ~10 minutes of ML deps.
          pip install -r requirements-ci.txt

      - name: Verify module imports (10 assertions)
        working-directory: tools/emotion-data-studio
        run: |
          python scripts/verify_integration_imports.py

      - name: Run Sprint 1 unit tests (hard filter + JSON schema)
        working-directory: tools/emotion-data-studio
        env:
          PYTHONIOENCODING: utf-8
        run: |
          if [ -f tests/test_sprint1_autocut.py ]; then
            python tests/test_sprint1_autocut.py
          else
            echo "::warning::test_sprint1_autocut.py not present, skipping"
          fi

      - name: Run Sprint 2 unit tests (verify pass + emotion lock)
        working-directory: tools/emotion-data-studio
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tests/test_sprint2_autocut.py

      - name: Run Sprint 3 unit tests (cache + cost + YouTube handler)
        working-directory: tools/emotion-data-studio
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tests/test_sprint3_autocut.py

      - name: Run Sprint 4 unit tests (review queue agent)
        working-directory: tools/emotion-data-studio
        env:
          PYTHONIOENCODING: utf-8
        run: |
          # Sprint 4 test lives in repo root /tests/ and reads backend.config
          # from PYTHONPATH. CI sets it explicitly to keep tests self-contained.
          PYTHONPATH=. python ../../tests/test_review_queue_agent.py

      - name: Summarize
        if: always()
        run: |
          echo "::group::Workflow summary"
          echo "Static checks: ${{ steps.verify-imports.outcome }}"
          echo "Sprint 1: ${{ steps.sprint1.outcome }}"
          echo "Sprint 2: ${{ steps.sprint2.outcome }}"
          echo "Sprint 3: ${{ steps.sprint3.outcome }}"
          echo "::endgroup::"